<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="light" name="color-scheme"/>
<title data-i18n="ui.pageTitle"></title>


<link href="styles.css" rel="stylesheet"/><script defer="" src="translations.js"></script><script defer="" src="cards.js"></script><script defer="" src="calculator.js"></script><script defer="" src="app.js"></script></head>
<body>
<div class="shell">
<header class="top">
<div class="brand">
<div aria-hidden="true" class="brand-mark">忍</div>
<div>
<div class="eyebrow" data-i18n="ui.brand"></div>
<h1 data-i18n="ui.heading"></h1>
<p class="subtitle" data-i18n="ui.cardCount" id="catalog-subtitle"></p>
</div>
</div>
<nav class="tabs" data-i18n-aria-label="ui.sections" role="tablist">
<button aria-controls="db-area" aria-selected="true" class="tab" data-i18n="ui.database" id="tab-db" role="tab"></button>
<button aria-controls="builder-area" aria-selected="false" class="tab" data-i18n="ui.builder" id="tab-builder" role="tab"></button>
</nav>
<div class="language-control"><label data-i18n="ui.language" for="language-select"></label><select data-i18n-aria-label="ui.language" id="language-select"></select></div></header>
<section aria-labelledby="tab-db" class="area" id="db-area" role="tabpanel">
<div id="db-filter-host"></div>
<main class="workspace"><section class="catalog" data-i18n-aria-label="ui.databaseEffects"><div class="card-list database-list" id="db-card-list"></div></section></main>
</section>
<section aria-labelledby="tab-builder" class="area hidden" id="builder-area" role="tabpanel">
<div id="builder-filter-host"></div>
<details aria-labelledby="scenario-title" class="scenario panel" id="scenario-panel" open="">
<summary class="panel-summary"><h2 data-i18n="ui.assumptions" id="scenario-title"></h2></summary>
<div class="scenario-fields">
<div class="parameter"><label data-i18n="ui.enemyChakra" data-i18n-rich="" for="s-enemy-chakra"></label><input data-integer="" id="s-enemy-chakra" inputmode="numeric" max="99" min="0" pattern="[0-9]*" required="" step="1" type="text" value="4"/></div>
<div class="parameter"><label data-i18n="ui.enemies" data-i18n-rich="" for="s-enemies"></label><input data-integer="" id="s-enemies" inputmode="numeric" max="99" min="0" pattern="[0-9]*" required="" type="text" value="4"/></div>
<div class="parameter"><label data-i18n="ui.allyChakra" data-i18n-rich="" for="s-ally-chakra"></label><input data-integer="" id="s-ally-chakra" inputmode="numeric" max="99" min="0" pattern="[0-9]*" required="" step="1" type="text" value="4"/></div>
<div class="parameter"><label data-i18n="ui.allies" data-i18n-rich="" for="s-allies"></label><input data-integer="" id="s-allies" inputmode="numeric" max="99" min="0" pattern="[0-9]*" required="" type="text" value="4"/></div>
<div class="parameter"><label data-i18n="ui.activations" data-i18n-rich="" for="s-activations"></label><input data-integer="" id="s-activations" inputmode="numeric" max="99" min="0" pattern="[0-9]*" required="" type="text" value="2"/></div>
<div class="scenario-actions"><button class="primary" data-i18n="ui.applyStandard" id="apply-standard"></button><button aria-controls="calculation-info-dialog" aria-haspopup="dialog" data-i18n="ui.calculationInfo" id="calculation-info-button"></button></div>
</div>
<div class="scenario-footer"><p class="inline-note" id="standard-status" role="status"></p></div>
</details>
<main class="workspace builder" id="workspace"><section class="catalog" data-i18n-aria-label="ui.builderCards"><div class="card-list" id="builder-card-list"></div></section>
<section class="deck-strip panel" data-i18n-aria-label="ui.deck" id="deck-panel">
<ol class="deck-grid" data-i18n-aria-label="ui.deckSlots" id="deck-grid"></ol>
<div class="metrics">
<div class="metric">
<b id="avg-cost">—</b>
<span data-i18n="ui.averageCost" data-i18n-rich=""></span>
</div>
<div class="metric">
<b id="avg-max">—</b>
<span data-i18n="ui.averagePower" data-i18n-rich=""></span>
</div>
<div class="metric highlight">
<b id="avg-quality">—</b>
<span data-i18n="ui.averageQuality" data-i18n-rich=""></span>
</div>
</div>
<div class="deck-preview-actions"><button aria-controls="deck-dialog" aria-haspopup="dialog" class="primary" data-i18n="ui.viewDeck" id="view-deck"></button><button data-i18n="ui.import" id="import-deck"></button><input accept=".json,application/json" hidden="" id="import-file" type="file"/></div>
</section>
</main>
</section>
</div>
<template id="filters-template">
<details class="filters-panel panel" data-i18n-aria-label="ui.searchFilters" open="">
<summary class="panel-summary"><h2 data-i18n="ui.filters"></h2></summary>
<div class="filter-fields">
<div class="field text-search"><label data-i18n="ui.textOrIndex" data-i18n-rich="" for="f-text"></label><input autocomplete="off" data-i18n-placeholder="ui.searchPlaceholder" id="f-text" type="search"/></div>
<div class="field filter-rarity"><label data-i18n="ui.rarity" data-i18n-rich="" for="f-rarity"></label><button aria-expanded="false" class="multi-filter" data-multi-filter="" id="f-rarity" type="button"><span class="filter-value"></span><span aria-hidden="true" class="filter-arrow">▾</span></button><div class="filter-menu" data-i18n-aria-label="ui.rarity" id="f-rarity-menu" popover="auto" role="group"></div></div>
<div class="field filter-season"><label data-i18n="ui.season" data-i18n-rich="" for="f-season"></label><button aria-expanded="false" class="multi-filter" data-multi-filter="" id="f-season" type="button"><span class="filter-value"></span><span aria-hidden="true" class="filter-arrow">▾</span></button><div class="filter-menu" data-i18n-aria-label="ui.season" id="f-season-menu" popover="auto" role="group"></div></div>
<div class="field filter-skill"><label data-i18n="ui.skillType" data-i18n-rich="" for="f-skill"></label><button aria-expanded="false" class="multi-filter" data-multi-filter="" id="f-skill" type="button"><span class="filter-value"></span><span aria-hidden="true" class="filter-arrow">▾</span></button><div class="filter-menu" data-i18n-aria-label="ui.skillType" id="f-skill-menu" popover="auto" role="group"></div></div>
<div class="field filter-cost"><label data-i18n="ui.cost" data-i18n-rich="" for="f-cost"></label><button aria-expanded="false" class="multi-filter" data-multi-filter="" id="f-cost" type="button"><span class="filter-value"></span><span aria-hidden="true" class="filter-arrow">▾</span></button><div class="filter-menu" data-i18n-aria-label="ui.cost" id="f-cost-menu" popover="auto" role="group"></div></div>
<div class="field filter-chakra"><label data-i18n="ui.chakra" data-i18n-rich="" for="f-chakra"></label><button aria-expanded="false" class="multi-filter" data-multi-filter="" id="f-chakra" type="button"><span class="filter-value"></span><span aria-hidden="true" class="filter-arrow">▾</span></button><div class="filter-menu" data-i18n-aria-label="ui.chakra" id="f-chakra-menu" popover="auto" role="group"></div></div>
<div class="field builder-only"><label data-i18n="ui.minPower" data-i18n-rich="" for="f-estimate"></label><input data-i18n-placeholder="ui.minimum" data-integer="" id="f-estimate" inputmode="numeric" max="99" min="0" pattern="[0-9]*" type="text"/></div>
<div class="field"><label data-i18n="ui.cardLevel" data-i18n-rich="" for="f-level"></label><button aria-checked="false" class="level-filter" data-level-toggle="" id="f-level" role="switch" type="button" value="1">1</button></div>
<div class="sort-tools"><div class="field"><label data-i18n="ui.sort" data-i18n-rich="" for="sort"></label><select data-i18n-aria-label="ui.sortCards" id="sort"><option data-i18n="ui.index" value="index"></option><option data-i18n="ui.alphabetical" value="name"></option><option data-i18n="ui.cost" value="cost"></option><option data-i18n="ui.chakra" value="chakra"></option><option class="builder-only" data-i18n="ui.quality" value="quality"></option><option data-i18n="ui.rarity" value="rarity"></option></select></div><button class="sort-direction" data-direction="asc" data-i18n-aria-label="ui.ascendingAction" data-i18n-title="ui.ascending" id="sort-direction">↑</button></div>
<button class="small reset-filters" data-i18n="ui.resetFilters" id="reset"></button>
</div>
</details>
</template>
<dialog aria-labelledby="deck-dialog-title" class="deck-dialog" id="deck-dialog">
<div class="dialog-head"><h2 data-i18n="ui.deck" id="deck-dialog-title"></h2><div class="deck-dialog-status"><span class="count" id="deck-count">0/10</span><button class="dialog-close" data-i18n-aria-label="ui.closeDeck" id="close-deck-dialog">✕</button></div></div>
<div class="deck-name-field"><label data-i18n="ui.deckNameLabel" data-i18n-rich="" for="deck-name"></label><input class="deck-name" data-i18n-placeholder="ui.deckNamePlaceholder" id="deck-name" maxlength="15"/></div>
<ol class="deck-grid" data-i18n-aria-label="ui.deckCardsLevels" id="deck-dialog-grid"></ol>
<div class="deck-summary-row">
<figure class="cost-curve"><div aria-describedby="cost-curve-caption" class="curve" data-i18n-aria-label="ui.distribution" id="curve" role="img"></div><figcaption data-i18n="ui.curveCaption" data-i18n-rich="" id="cost-curve-caption"></figcaption></figure>
<div class="metrics deck-averages">
<div class="metric">
<b id="deck-dialog-avg-cost">—</b>
<span data-i18n="ui.averageCost" data-i18n-rich=""></span>
</div>
<div class="metric">
<b id="deck-dialog-avg-max">—</b>
<span data-i18n="ui.averagePower" data-i18n-rich=""></span>
</div>
<div class="metric highlight">
<b id="deck-dialog-avg-quality">—</b>
<span data-i18n="ui.averageQuality" data-i18n-rich=""></span>
</div>
</div>
</div>
<div class="deck-buttons">
<button class="primary" data-i18n="ui.export" id="export-deck"></button>
<button class="danger strong-danger" data-i18n="ui.clearDeck" id="clear-deck"></button>
</div>
</dialog>
<dialog aria-labelledby="dialog-title" id="card-dialog">
<div class="dialog-head">
<div>
<h2 class="dialog-title" id="dialog-title">
</h2>
</div>
<button data-i18n-aria-label="ui.closeCard" id="close-dialog">✕</button>
</div>
<div id="dialog-body">
</div>
</dialog>
<dialog aria-labelledby="calculation-info-title" class="calculation-info" id="calculation-info-dialog">
<div class="dialog-head"><h2 data-i18n="ui.calculationInfo" id="calculation-info-title"></h2><button class="dialog-close" data-i18n-aria-label="ui.closeInfo" id="close-calculation-info">✕</button></div>
<ul>
<li data-i18n="ui.info1" data-i18n-rich=""></li>
<li data-i18n="ui.info2" data-i18n-rich=""></li>
<li data-i18n="ui.info3" data-i18n-rich=""></li>
<li data-i18n="ui.info4" data-i18n-rich=""></li>
<li data-i18n="ui.info5" data-i18n-rich=""></li>
<li data-i18n="ui.info6" data-i18n-rich=""></li>
</ul>
</dialog>
<dialog aria-labelledby="confirm-title" id="confirm-dialog" style="max-width:336px">
<h2 data-i18n="ui.confirm" id="confirm-title"></h2>
<p id="confirm-text" style="margin:14px 0">
</p>
<div style="display:flex;gap:7px;justify-content:flex-end">
<button data-i18n="ui.cancel" id="confirm-no"></button>
<button class="primary" data-i18n="ui.confirm" id="confirm-yes"></button>
</div>
</dialog>
<div aria-live="polite" class="toast hidden" id="toast" role="status">
</div>




</body>
</html>
